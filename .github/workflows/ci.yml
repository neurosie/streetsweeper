name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          SKIP_ENV_VALIDATION: true

      - name: Run unit tests
        run: npm run test:unit
        env:
          SKIP_ENV_VALIDATION: true

      - name: Run integration tests
        run: npm run test:integration
        env:
          SKIP_ENV_VALIDATION: true
        # GitHub Actions runners have Docker pre-installed
        # Testcontainers will automatically use it

      - name: Type check
        run: npx tsc --noEmit
        env:
          SKIP_ENV_VALIDATION: true

      - name: Lint
        run: npm run lint
        env:
          SKIP_ENV_VALIDATION: true

  # Optional: Build check to ensure the app builds successfully
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test # Only run if tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          SKIP_ENV_VALIDATION: true

      - name: Build application
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: true
          # Provide dummy env vars for build
          POSTGRES_PRISMA_URL: postgresql://dummy:dummy@localhost:5432/dummy
          POSTGRES_URL_NON_POOLING: postgresql://dummy:dummy@localhost:5432/dummy
